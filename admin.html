<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0D1F2D">
<title>RSVP Dashboard — EZScript Christmas Party 2026</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --night:#0D1F2D; --deep:#15532E; --green:#16B14B; --ink:#14212B; --ink2:#41525E; --muted:#6B7B86;
    --line:#E4E9ED; --bg:#F5F7F8; --card:#FFFFFF; --gold:#E8C468;
    --yes-bg:#E6F6EC; --yes-ink:#12622F; --maybe-bg:#FFF4DC; --maybe-ink:#8A5A00; --no-bg:#F1F3F5; --no-ink:#56636C;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);background:var(--bg);
    -webkit-text-size-adjust:100%;-webkit-font-smoothing:antialiased;min-height:100vh}
  button,input,select{font:inherit;color:inherit}
  button{cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}

  /* Header */
  header{background:var(--night);color:#fff;padding:calc(env(safe-area-inset-top) + 14px) 24px 14px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
  header .brand{background:#fff;border-radius:10px;padding:6px 10px;display:flex}
  header .brand img{height:28px;width:auto}
  header h1{font-size:17px;font-weight:600;letter-spacing:.01em}
  header .sub{font-size:12.5px;color:rgba(255,255,255,.62);margin-top:2px}
  header .spacer{flex:1}
  .hbtn{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.18);color:#fff;border-radius:9px;padding:8px 12px;font-size:13px;font-weight:500}
  .hbtn:hover{background:rgba(255,255,255,.16)}

  main{max-width:1280px;margin:0 auto;padding:22px 24px calc(env(safe-area-inset-bottom) + 40px)}

  /* Login */
  .login{max-width:400px;margin:9vh auto 0;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:30px;box-shadow:0 10px 30px rgba(13,31,45,.06)}
  .login img{display:block;height:44px;width:auto;margin:0 auto 18px}
  .login h2{font-size:19px;text-align:center;margin-bottom:6px}
  .login p{font-size:13.5px;color:var(--muted);text-align:center;margin-bottom:20px;line-height:1.5}
  .login label{font-size:12.5px;font-weight:600;color:var(--ink2);display:block;margin-bottom:6px}
  .login input[type=password]{width:100%;padding:13px 14px;border:1.5px solid var(--line);border-radius:10px;font-size:16px;outline:none}
  .login input[type=password]:focus{border-color:var(--green);box-shadow:0 0 0 4px rgba(22,177,75,.12)}
  .remember{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink2);margin:14px 0 18px}
  .primary{width:100%;background:linear-gradient(135deg,var(--green),var(--deep));color:#fff;border:0;border-radius:10px;padding:13px;font-weight:600;font-size:15px}
  .primary:disabled{opacity:.6}
  .msg{font-size:13px;margin-top:12px;text-align:center;min-height:18px}
  .msg.err{color:#B4232E}

  /* KPI tiles */
  .kpis{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;margin-bottom:14px}
  .tile{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
  .tile .k{font-size:12px;color:var(--muted);font-weight:500}
  .tile .v{font-size:28px;font-weight:700;letter-spacing:-.02em;margin-top:4px;font-variant-numeric:tabular-nums}
  .tile .s{font-size:12px;color:var(--muted);margin-top:2px}
  .tile.hl{border-color:#BFE3CB;background:linear-gradient(180deg,#F4FBF6,#fff)}
  .funnel{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 16px;margin-bottom:18px;font-size:13px;color:var(--ink2)}
  .funnel b{color:var(--ink);font-variant-numeric:tabular-nums}
  .funnel .arrow{color:#B7C2CA}
  .funnel .lbl{font-weight:600;color:var(--ink);margin-right:4px}

  /* Toolbar */
  .toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:12px}
  .search{flex:1 1 260px;position:relative}
  .search input{width:100%;padding:10px 12px 10px 36px;border:1px solid var(--line);border-radius:10px;background:#fff;font-size:14px;outline:none}
  .search input:focus{border-color:var(--green)}
  .search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%)}
  .seg{display:inline-flex;background:#fff;border:1px solid var(--line);border-radius:10px;padding:3px}
  .seg button{border:0;background:transparent;padding:7px 12px;border-radius:7px;font-size:13px;font-weight:500;color:var(--ink2)}
  .seg button.on{background:var(--night);color:#fff}
  .seg button .c{opacity:.65;margin-left:4px;font-variant-numeric:tabular-nums}
  .tbtn{display:inline-flex;align-items:center;gap:6px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:9px 12px;font-size:13px;font-weight:500}
  .tbtn:hover{border-color:#C9D3DA}
  .meta{font-size:12px;color:var(--muted);margin-left:auto;display:flex;align-items:center;gap:10px}
  .meta label{display:flex;align-items:center;gap:5px;cursor:pointer}

  /* Table */
  .tablewrap{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:auto}
  table{width:100%;border-collapse:collapse;font-size:13.5px;min-width:980px}
  thead th{position:sticky;top:0;background:#FAFBFC;text-align:left;font-size:12px;font-weight:600;color:var(--ink2);padding:11px 14px;border-bottom:1px solid var(--line);white-space:nowrap;user-select:none}
  thead th[data-k]{cursor:pointer}
  thead th[data-k]:hover{color:var(--ink)}
  thead th .ar{display:inline-block;width:10px;margin-left:3px;color:var(--deep)}
  tbody td{padding:12px 14px;border-bottom:1px solid #EEF1F3;vertical-align:middle;white-space:nowrap}
  tbody tr:last-child td{border-bottom:0}
  tbody tr:hover td{background:#FAFCFB}
  td.num{text-align:right;font-variant-numeric:tabular-nums}
  th.num{text-align:right}
  td .nm{font-weight:600}
  td a{color:var(--deep);text-decoration:none}
  td a:hover{text-decoration:underline}
  td .dim{color:var(--muted);font-size:12.5px}
  .pill{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;font-size:12px;font-weight:600}
  .pill.Yes{background:var(--yes-bg);color:var(--yes-ink)}
  .pill.Maybe{background:var(--maybe-bg);color:var(--maybe-ink)}
  .pill.No{background:var(--no-bg);color:var(--no-ink)}
  .tag{font-size:12px;background:#EEF2F5;color:var(--ink2);padding:2px 7px;border-radius:6px;font-family:ui-monospace,Menlo,monospace}
  .empty{padding:50px 20px;text-align:center;color:var(--muted);font-size:14px}
  .foot{font-size:12px;color:var(--muted);margin-top:10px}

  @media (max-width:1100px){ .kpis{grid-template-columns:repeat(3,1fr)} }
  /* Phones: rows become cards */
  @media (max-width:760px){
    header{padding-left:16px;padding-right:16px}
    main{padding:16px 14px 40px}
    .kpis{grid-template-columns:repeat(2,1fr);gap:10px}
    .tile .v{font-size:24px}
    .meta{margin-left:0;width:100%;justify-content:space-between}
    .tablewrap{background:transparent;border:0;overflow:visible}
    table{min-width:0}
    thead{display:none}
    tbody tr{display:grid;grid-template-columns:1fr 1fr;gap:6px 12px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px}
    tbody tr:hover td{background:transparent}
    tbody td{border:0;padding:0;white-space:normal;word-break:break-word}
    tbody td::before{content:attr(data-l);display:block;font-size:11px;color:var(--muted);font-weight:500;margin-bottom:1px}
    tbody td.full{grid-column:1/-1}
    tbody td.num{text-align:left}
    td[data-l="Name"]::before{display:none}
    td[data-l="Name"] .nm{font-size:15px}
  }
  @media (hover:none){ .hbtn:hover,.tbtn:hover{background:inherit} }
</style>
</head>

    <h2>RSVP Dashboard</h2>
    <p>Enter the admin key set in <code>ADMIN_KEY</code> in the Apps Script.</p>
    <form id="loginForm" autocomplete="off">
      <label for="key">Admin key</label>
      <input type="password" id="key" autocomplete="current-password" required>
      <label class="remember"><input type="checkbox" id="remember"> Keep me signed in on this device</label>
      <button class="primary" id="loginBtn" type="submit">View RSVPs</button>
      <div class="msg" id="loginMsg"></div>
    </form>
  </section>

  <!-- Dashboard -->
  <section id="dash" hidden>
    <div class="kpis" id="kpis"></div>
    <div class="funnel" id="funnel"></div>

    <div class="toolbar">
      <div class="search">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#6B7B86" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        <input id="q" type="search" placeholder="Search name, email, phone, invite ID…" aria-label="Search">
      </div>
      <div class="seg" id="seg" role="tablist" aria-label="Filter by attendance"></div>
      <button class="tbtn" id="refresh" title="Refresh">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></svg>Refresh</button>
      <button class="tbtn" id="csv">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 3v12M7 10l5 5 5-5M4 21h16"/></svg>Export CSV</button>
      <div class="meta"><span id="updated"></span><label><input type="checkbox" id="auto" checked> Auto-refresh</label></div>
    </div>

    <div class="tablewrap">
      <table>
        <thead><tr>
          <th data-k="name">Name<span class="ar"></span></th>
          <th data-k="email">Email<span class="ar"></span></th>
          <th data-k="phone">Phone<span class="ar"></span></th>
          <th data-k="attending">Attending<span class="ar"></span></th>
          <th data-k="guests" class="num">Guests<span class="ar"></span></th>
          <th data-k="invite">Invite ID<span class="ar"></span></th>
          <th data-k="lastUpdated">Submitted<span class="ar"></span></th>
          <th data-k="times" class="num">Edits<span class="ar"></span></th>
          <th data-k="device">Device<span class="ar"></span></th>
        </tr></thead>
        <tbody id="rows"></tbody>
      </table>
      <div class="empty" id="empty" hidden></div>
    </div>
    <p class="foot" id="foot"></p>
  </section>
</main>

<script src="config.js"></script>
<script>
const ENDPOINT = String((window.RSVP_CONFIG||{}).ENDPOINT || "").trim();
const KEY_STORE = "ez_admin_key";
const $ = id => document.getElementById(id);
const S = { key:"", rows:[], funnel:{}, filter:"All", q:"", sort:{k:"lastUpdated",dir:-1}, timer:0 };

const ss = { get(k){ try{ return sessionStorage.getItem(k) || localStorage.getItem(k); }catch(e){ return null; } },
             set(k,v,persist){ try{ (persist?localStorage:sessionStorage).setItem(k,v); }catch(e){} },
             del(k){ try{ sessionStorage.removeItem(k); localStorage.removeItem(k); }catch(e){} } };

async function api(key){
  if (!ENDPOINT) throw new Error("No ENDPOINT in config.js — upload config.js with your Apps Script /exec URL.");
  let r;
  try{
    r = await fetch(ENDPOINT, { method:"POST", headers:{ "Content-Type":"text/plain;charset=utf-8" },
      body: JSON.stringify({ type:"admin_list", key }) });
  }catch(e){ throw new Error("Couldn't reach the backend. Check the web app is deployed with access “Anyone”, then Deploy → New version."); }
  const t = await r.text(); let j;
  try{ j = JSON.parse(t); }catch(e){ throw new Error("Backend returned a web page instead of data — check the deployment access is “Anyone”."); }
  if (!j.ok){
    const m = { bad_key:"That key isn't right.", locked:"Too many wrong attempts — locked for 15 minutes.",
                admin_disabled:"Dashboard is off: set ADMIN_KEY in Code.gs, then Deploy → New version.",
                unknown_type:"The Apps Script is an older version — paste the new Code.gs and Deploy → New version." }[j.error];
    const err = new Error(m || ("Backend error: " + j.error)); err.code = j.error; throw err;
  }
  return j;
}

/* ---------- Login ---------- */
$("loginForm").addEventListener("submit", async e=>{
  e.preventDefault();
  const key = $("key").value.trim(); if (!key) return;
  $("loginBtn").disabled = true; $("loginMsg").className = "msg"; $("loginMsg").textContent = "Checking…";
  try{
    const j = await api(key);
    S.key = key; ss.set(KEY_STORE, key, $("remember").checked);
    show(j);
  }catch(err){ $("loginMsg").className = "msg err"; $("loginMsg").textContent = err.message; }
  finally{ $("loginBtn").disabled = false; }
});
$("logout").onclick = ()=>{ ss.del(KEY_STORE); clearInterval(S.timer); location.reload(); };

function show(j){
  $("login").hidden = true; $("dash").hidden = false; $("logout").hidden = false;
  ingest(j); startAuto();
}
function ingest(j){
  S.rows = j.rsvps || []; S.funnel = j.funnel || {};
  $("updated").textContent = "Updated " + new Date().toLocaleTimeString([], {hour:"numeric",minute:"2-digit"});
  $("foot").textContent = "Source: Google Sheet “" + (j.sheet||"") + "” · RSVPs tab. Sorted by " + labelOf(S.sort.k) + ".";
  renderKpis(); renderSeg(); renderRows();
}
async function refresh(){
  const b = $("refresh"); b.disabled = true;
  try{ ingest(await api(S.key)); }
  catch(err){ if (err.code==="bad_key"||err.code==="locked"){ ss.del(KEY_STORE); location.reload(); } else $("updated").textContent = "⚠ " + err.message; }
  finally{ b.disabled = false; }
}
function startAuto(){ clearInterval(S.timer); if ($("auto").checked) S.timer = setInterval(()=>{ if(!document.hidden) refresh(); }, 60000); }
$("auto").onchange = startAuto;
$("refresh").onclick = refresh;
document.addEventListener("visibilitychange", ()=>{ if (!document.hidden && S.key && $("auto").checked) refresh(); });

/* ---------- KPIs ---------- */
const nf = n => Number(n||0).toLocaleString();
function renderKpis(){
  const r = S.rows, c = a => r.filter(x=>x.attending===a);
  const yes=c("Yes"), maybe=c("Maybe"), no=c("No");
  const sum = a => a.reduce((t,x)=>t+(Number(x.guests)||0),0);
  const tiles = [
    ["Responses", r.length, ""],
    ["Yes", yes.length, "attending"],
    ["Maybe", maybe.length, "undecided"],
    ["No", no.length, "declined"],
    ["Confirmed headcount", sum(yes), "guests from Yes", true],
    ["Possible headcount", sum(yes)+sum(maybe), "Yes + Maybe"]
  ];
  $("kpis").innerHTML = tiles.map(([k,v,s,hl])=>`<div class="tile${hl?" hl":""}"><div class="k">${k}</div><div class="v">${nf(v)}</div><div class="s">${s}</div></div>`).join("");
  const f=S.funnel, pct = (a,b)=> b ? Math.round(a/b*100)+"%" : "—";
  $("funnel").innerHTML = `<span class="lbl">Funnel</span>
    <span>Opened <b>${nf(f.opened)}</b></span><span class="arrow">→</span>
    <span>Started <b>${nf(f.started)}</b></span><span class="arrow">→</span>
    <span>Submitted <b>${nf(f.submitted)}</b></span><span class="arrow">→</span>
    <span>Added to calendar <b>${nf(f.calendar)}</b></span>
    <span style="margin-left:auto">Conversion <b>${pct(f.submitted,f.opened)}</b></span>`;
}

/* ---------- Filter / search / sort ---------- */
function renderSeg(){
  const n = a => a==="All" ? S.rows.length : S.rows.filter(x=>x.attending===a).length;
  $("seg").innerHTML = ["All","Yes","Maybe","No"].map(a=>`<button role="tab" aria-selected="${S.filter===a}" class="${S.filter===a?"on":""}" data-f="${a}">${a}<span class="c">${n(a)}</span></button>`).join("");
  $("seg").querySelectorAll("button").forEach(b=>b.onclick=()=>{ S.filter=b.dataset.f; renderSeg(); renderRows(); });
}
$("q").addEventListener("input", e=>{ S.q = e.target.value.trim().toLowerCase(); renderRows(); });
document.querySelectorAll("th[data-k]").forEach(th=>th.addEventListener("click",()=>{
  const k = th.dataset.k; S.sort = { k, dir: S.sort.k===k ? -S.sort.dir : (["lastUpdated","guests","times"].includes(k)?-1:1) };
  renderRows(); $("foot").textContent = $("foot").textContent.replace(/Sorted by .*/, "Sorted by " + labelOf(k) + ".");
}));
const labelOf = k => ({name:"name",email:"email",phone:"phone",attending:"attendance",guests:"guests",invite:"invite ID",lastUpdated:"most recent",times:"edits",device:"device"})[k]||k;

function visible(){
  let r = S.rows.slice();
  if (S.filter!=="All") r = r.filter(x=>x.attending===S.filter);
  if (S.q){ const q=S.q, qd=q.replace(/\D/g,""); r = r.filter(x=>[x.name,x.email,x.invite].some(v=>String(v||"").toLowerCase().includes(q)) || (qd && String(x.phone).includes(qd))); }
  const {k,dir} = S.sort;
  r.sort((a,b)=>{ let A=a[k], B=b[k]; if (A===""||A==null) return 1; if (B===""||B==null) return -1;
    if (typeof A==="number"&&typeof B==="number") return (A-B)*dir; return String(A).localeCompare(String(B),undefined,{numeric:true,sensitivity:"base"})*dir; });
  return r;
}

/* ---------- Table ---------- */
const esc = s => String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmtPhone = p => { p=String(p||""); return p.length===10 ? `(${p.slice(0,3)}) ${p.slice(3,6)}-${p.slice(6)}` : p.length===11&&p[0]==="1" ? `+1 (${p.slice(1,4)}) ${p.slice(4,7)}-${p.slice(7)}` : p; };
const fmtDate = s => { if(!s) return ""; const d=new Date(s); if(isNaN(d)) return esc(s); return d.toLocaleDateString([], {month:"short",day:"numeric"}) + ", " + d.toLocaleTimeString([], {hour:"numeric",minute:"2-digit"}); };
const devIcon = d => d==="mobile" ? "📱" : d==="tablet" ? "📲" : d==="desktop" ? "💻" : "";
const mark = { Yes:"✓", Maybe:"?", No:"✕" };
const osName = o => ({ios:"iOS",mac:"macOS",android:"Android",windows:"Windows",other:"Other"})[o] || o || "";

function renderRows(){
  document.querySelectorAll("th[data-k] .ar").forEach(s=>s.textContent="");
  const th = document.querySelector(`th[data-k="${S.sort.k}"] .ar`); if (th) th.textContent = S.sort.dir>0 ? "▲" : "▼";
  const r = visible();
  $("rows").innerHTML = r.map(x=>`<tr>
    <td data-l="Name" class="full"><span class="nm">${esc(x.name)}</span></td>
    <td data-l="Email" class="full"><a href="mailto:${esc(x.email)}">${esc(x.email)}</a></td>
    <td data-l="Phone"><a href="tel:${esc(x.phone)}">${esc(fmtPhone(x.phone))}</a></td>
    <td data-l="Attending"><span class="pill ${esc(x.attending)}">${mark[x.attending]||""} ${esc(x.attending)}</span></td>
    <td data-l="Guests" class="num">${x.guests===""?'<span class="dim">—</span>':esc(x.guests)}</td>
    <td data-l="Invite ID">${x.invite?`<span class="tag">${esc(x.invite)}</span>`:'<span class="dim">—</span>'}</td>
    <td data-l="Submitted" title="First: ${esc(fmtDate(x.firstSubmitted))}">${fmtDate(x.lastUpdated)}</td>
    <td data-l="Edits" class="num">${x.times>1?esc(x.times-1):'<span class="dim">0</span>'}</td>
    <td data-l="Device">${devIcon(x.device)} <span class="dim">${esc(osName(x.os))}${x.browser?" · "+esc(x.browser):""}</span></td>
  </tr>`).join("");
  const e = $("empty");
  e.hidden = r.length>0;
  e.textContent = S.rows.length===0 ? "No RSVPs yet. They'll appear here as soon as guests respond." : "No RSVPs match your search or filter.";
}

/* ---------- CSV export ---------- */
$("csv").onclick = ()=>{
  const cols = [["Name","name"],["Email","email"],["Phone","phone"],["Attending","attending"],["Guests (incl. self)","guests"],["Invite ID","invite"],
                ["First Submitted","firstSubmitted"],["Last Updated","lastUpdated"],["Times Submitted","times"],["OS","os"],["Device","device"],["Browser","browser"]];
  const cell = v => { let s=String(v==null?"":v); if (/^[=+\-@]/.test(s)) s="'"+s; return /[",\n]/.test(s) ? `"${s.replace(/"/g,'""')}"` : s; };
  const csv = "﻿" + [cols.map(c=>c[0]).join(","), ...visible().map(x=>cols.map(c=>cell(x[c[1]])).join(","))].join("\r\n");
  const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([csv],{type:"text/csv;charset=utf-8"}));
  a.download = "EZScript-Christmas-RSVPs-" + new Date().toISOString().slice(0,10) + ".csv";
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href), 3000);
};

/* ---------- Boot ---------- */
(async function(){
  const saved = ss.get(KEY_STORE);
  if (!saved){ $("key").focus(); return; }
  $("loginMsg").textContent = "Signing in…";
  try{ const j = await api(saved); S.key = saved; show(j); }
  catch(err){ ss.del(KEY_STORE); $("loginMsg").className="msg err"; $("loginMsg").textContent = err.message; }
})();
</script>
